[package]
authors = ["Willem Vanhulle <willemvanhulle@protonmail.com>"]
description = "Find the cause of frequent Cargo rebuilds"
edition = "2024"
keywords = ["compilation", "cargo", "fingerprint", "helper", "tool"]
license = "MIT"
name = "cargo-frequent"
repository = "https://github.com/wvhulle/cargo-frequent"
version = "0.2.0"
exclude = ["e2e-test-crates"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
ascii-dag = "0.11.0"
cargo_metadata = "0.23.1"
clap = { version = "4.0", features = ["derive"] }
colorchoice = "1.0.5"
colorchoice-clap = "1.0.8"
jiff = "0.2.23"
nom = "7.1"
rnix = "0.15.0"
rowan = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
supports-hyperlinks = "3.2.0"
terminal-link = "0.1.0"
termtree = "1.0.0"
toml_edit = "0.25.17"
url = "2.5.8"

[[test]]
name = "e2e_crates"
harness = false

[dev-dependencies]
assert_cmd = "2.0"
fs_extra = "1.3.0"
libtest-mimic = "0.8.2"
tempfile = "3.8"
toml = "1.1.8"
xshell = "0.2.7"


[lints]
workspace = true

[workspace]
members = [".", "xtask"]

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "deny"
collapsible_else_if = "deny"
collapsible_if = "deny"
explicit_counter_loop = "deny"
explicit_iter_loop = "deny"
filter_map_next = "deny"
flat_map_identity = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "allow"
manual_clamp = "deny"
manual_filter_map = "deny"
manual_find = "deny"
manual_map = "deny"
manual_ok_or = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
manual_unwrap_or = "deny"
manual_while_let_some = "deny"
map_err_ignore = "deny"
map_flatten = "deny"
map_unwrap_or = "deny"
match_bool = "deny"
missing_assert_message = "deny"
min_ident_chars = "deny"
missing_const_for_fn = "deny"
multiple_inherent_impl = "deny"
mut_mut = "deny"
needless_bool = "deny"
needless_bool_assign = "deny"
needless_collect = "deny"
needless_continue = "deny"
needless_for_each = "allow"
needless_range_loop = "deny"
option_if_let_else = "deny"
option_map_or_none = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
significant_drop_tightening = "deny"
single_match_else = "deny"
single_option_map = "deny"
too_long_first_doc_paragraph = "deny"
trait_duplication_in_bounds = "deny"
trivial_regex = "deny"
type_repetition_in_bounds = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_mut_passed = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
verbose_file_reads = "deny"
