[inspect]
env_overrides = { BINDGEN_EXTRA_CLANG_ARGS = "-isystem /nix/store/m38wglsqnh1mrmj2cmqa3pjb6w4yjxdi-glibc-2.44-25-dev/include -frandom-seed=f020dci6a9" }
